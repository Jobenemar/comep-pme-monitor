  const today=new Date().toLocaleDateString("pt-BR",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const doLogout=()=>{persistAll();if(unsubRef.current){unsubRef.current();unsubRef.current=null}if(unsubAuthRef.current){unsubAuthRef.current();unsubAuthRef.current=null}setLoggedUser(null)};

  const renderDashboard=()=>(<div className="fade-in" style={{maxWidth:1200,margin:"0 auto"}}><div style={{marginBottom:22}}><h2 style={{fontSize:22,fontWeight:800,color:"var(--text-50)"}}>Dashboard</h2><p style={{color:"var(--text-500)",fontSize:13}}>Visão geral do Plano Municipal de Educação</p></div><div className="stats-grid">{[{l:"Total de Metas",v:allMetas.length,c:"#60a5fa",bg:"rgba(59,130,246,.06)",bd:"rgba(59,130,246,.15)",bc:"#3b82f6",i:"🎯"},{l:"Concluídas",v:counts.concluida,c:"#34d399",bg:"rgba(16,185,129,.06)",bd:"rgba(16,185,129,.15)",bc:"#10b981",i:"✅"},{l:"Em Andamento",v:counts.andamento,c:"#fbbf24",bg:"rgba(234,179,8,.06)",bd:"rgba(234,179,8,.15)",bc:"#f59e0b",i:"🕐"},{l:"Atrasadas",v:counts.atrasada,c:"#f87171",bg:"rgba(239,68,68,.06)",bd:"rgba(239,68,68,.15)",bc:"#ef4444",i:"⚠️"},{l:"Não Iniciadas",v:counts["nao-iniciada"],c:"#94a3b8",bg:"rgba(148,163,184,.04)",bd:"rgba(148,163,184,.1)",bc:"#64748b",i:"⊖"},{l:"Progresso Geral",v:null,pct:totalProg,c:"#2dd4bf",bg:"rgba(20,184,166,.06)",bd:"rgba(20,184,166,.15)",bc:"#14b8a6",i:"📈"}].map((c,i)=>(<div key={i} className="stat-card card-enter" style={{background:c.bg,borderColor:c.bd,animationDelay:`${i*.06}s`}}><div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}><div><div className="lbl">{c.l}</div><div className="val" style={{color:c.c,marginTop:4}}>{c.pct!==undefined&&c.pct!==null?<><CountUp to={c.pct} decimals={0}/>%</>:<CountUp to={c.v}/>}</div></div><div className="ico">{c.i}</div></div><div style={{position:"absolute",bottom:0,left:0,right:0,height:2,background:c.bc,opacity:.3}}/></div>))}</div><div className="grid-2" style={{marginBottom:18}}><div className="card"><div className="card-header"><span className="card-title">Metas por Eixo e Status</span></div><div className="card-body"><BarChart metaStats={metaStats}/></div></div><div className="card"><div className="card-header"><span className="card-title">Evolução dos Indicadores Principais</span></div><div className="card-body"><LineChart metaStats={metaStats} data={data}/></div></div></div><div className="card"><div className="card-header"><span className="card-title">Progresso por Meta</span></div><div className="card-body"><div style={{display:"grid",gap:6}}>{metaStats.map((m,i)=>(<div key={m.id} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:i<metaStats.length-1?"1px solid rgba(148,163,184,.06)":"none",cursor:"pointer",transition:"all .15s",borderRadius:6}} onClick={()=>setSelectedMeta(allMetas.find(x=>x.id===m.id))} onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,.02)"} onMouseOut={e=>e.currentTarget.style.background="transparent"}><span style={{fontSize:11,fontWeight:800,color:"var(--emerald)",fontFamily:"'JetBrains Mono'",width:52,flexShrink:0}}>{m.numero.replace("Meta ","M")}</span><div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600,color:"var(--text-200)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.titulo}</div><div className="progress-bar" style={{height:5,marginTop:5}}><div className="progress-fill" style={{width:`${m.avgProg}%`,background:m.avgProg>=100?"#16a34a":m.avgProg>=60?"#d97706":"#dc2626"}}/></div></div><span className={`status-badge status-${m.status}`} style={{flexShrink:0,fontSize:9}}>{statusLabel[m.status]}</span><span style={{fontSize:12,fontWeight:700,fontFamily:"'JetBrains Mono'",color:statusColor[m.status],flexShrink:0,width:40,textAlign:"right"}}>{m.avgProg.toFixed(0)}%</span><span style={{color:"var(--text-600)",fontSize:14,flexShrink:0}}>›</span></div>))}</div></div></div></div>);

  const renderMetas=()=>(<div className="fade-in" style={{maxWidth:1200,margin:"0 auto"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:10}}><div><h2 style={{fontSize:22,fontWeight:800,color:"var(--text-50)"}}>Metas do PME</h2><p style={{color:"var(--text-500)",fontSize:13}}>Gerencie todas as metas do Plano Municipal de Educação</p></div>{!isRO&&<button className="btn primary" style={{padding:"8px 18px",fontSize:12}} onClick={()=>setShowNewMeta(true)}>＋ Nova Meta</button>}</div><div className="card" style={{marginBottom:18}}><div className="card-header"><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14}}>◎</span><span className="card-title">Metas do PME</span><span style={{fontSize:11,color:"var(--text-500)",background:"rgba(0,0,0,.2)",borderRadius:12,padding:"2px 8px"}}>{filtered.length}/{allMetas.length}</span></div><div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}><div style={{position:"relative"}}><span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:13,color:"var(--text-500)"}}>🔍</span><input className="search-input" placeholder="Buscar metas..." value={search} onChange={e=>setSearch(e.target.value)}/></div><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:12,color:"var(--text-500)"}}>🏷️</span><select className="filter-select" value={filterEixo} onChange={e=>setFilterEixo(e.target.value)}>{EIXOS.map(e=><option key={e}>{e}</option>)}</select></div><select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div></div><div className="card-body">{filtered.length===0&&<div style={{textAlign:"center",padding:40,color:"var(--text-500)"}}><div style={{fontSize:32,marginBottom:10}}>🔍</div><div style={{fontWeight:600}}>Nenhuma meta encontrada.</div></div>}<div style={{display:"grid",gap:10}}>{filtered.map((m,idx)=>(<div key={m.id} className="meta-item fade-in" style={{animationDelay:`${Math.min(idx*.03,.3)}s`}}><div style={{position:"absolute",left:0,top:0,bottom:0,width:3,borderRadius:"0 2px 2px 0",background:statusColor[m.status]}}/><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:14,flexWrap:"wrap"}}><div style={{flex:1,minWidth:200,cursor:"pointer"}} onClick={()=>setSelectedMeta(allMetas.find(x=>x.id===m.id))}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{fontSize:12,fontWeight:800,color:"var(--emerald)",fontFamily:"'JetBrains Mono'"}}>{m.numero}</span><span className="badge" style={{background:`${prioColor[m.prioridade]}15`,color:prioColor[m.prioridade],border:`1px solid ${prioColor[m.prioridade]}25`,fontSize:9}}>{m.prioridade}</span>{m.id&&m.id.startsWith("custom-")&&<span style={{fontSize:9,fontWeight:700,background:"rgba(59,130,246,.15)",color:"var(--blue)",borderRadius:4,padding:"1px 5px"}}>CUSTOM</span>}</div><div style={{fontSize:14,fontWeight:700,color:"var(--text-100)",marginBottom:3}}>{m.titulo}</div><div style={{fontSize:11,color:"var(--text-300)",lineHeight:1.5,display:"-webkit-box",WebkitLineClamp:1,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{m.descricao}</div></div><div style={{display:"flex",alignItems:"center",gap:12,flexShrink:0}}><div style={{textAlign:"center"}}><div style={{fontSize:9,color:"var(--text-600)",fontWeight:600,marginBottom:2}}>📅</div><div style={{fontSize:11,color:"var(--text-400)"}}>{m.prazo}</div></div><span className={`status-badge status-${m.status}`}>{statusLabel[m.status]}</span><div style={{display:"flex",alignItems:"center",gap:6}}><div className="progress-bar" style={{width:60,height:5}}><div className="progress-fill" style={{width:`${m.avgProg}%`,background:statusColor[m.status]}}/></div><span style={{fontSize:12,fontWeight:700,fontFamily:"'JetBrains Mono'",color:statusColor[m.status],minWidth:32,textAlign:"right"}}>{m.avgProg.toFixed(0)}%</span></div>{!isRO&&<button style={{background:"none",border:"none",color:"var(--text-600)",cursor:"pointer",fontSize:15,padding:"2px 4px",borderRadius:4,transition:"color .15s",flexShrink:0}} title="Excluir" onClick={e=>{e.stopPropagation();setConfirmDelMeta(m)}} onMouseOver={e=>e.currentTarget.style.color="#ef4444"} onMouseOut={e=>e.currentTarget.style.color="var(--text-600)"}>🗑️</button>}<span style={{color:"var(--text-600)",fontSize:16,cursor:"pointer"}} onClick={()=>setSelectedMeta(allMetas.find(x=>x.id===m.id))}>›</span></div></div></div>))}</div></div></div></div>);

  const renderIndicadores=()=>(<div className="fade-in" style={{maxWidth:1200,margin:"0 auto"}}><div style={{marginBottom:18}}><h2 style={{fontSize:22,fontWeight:800,color:"var(--text-50)"}}>Indicadores</h2><p style={{color:"var(--text-500)",fontSize:13}}>{allInds.length} indicadores · Metodologia INEP/MEC</p></div>{isRO&&<div className="alert-info" style={{marginBottom:14}}>🔒 Modo somente leitura.</div>}<div className="card" style={{overflow:"hidden"}}><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}><thead><tr style={{background:"rgba(0,0,0,.15)"}}>{["Meta","Indicador","Base","Atual","Meta PME","Meta PNE 2026","Progresso","Status"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"left",fontSize:9,fontWeight:700,color:"var(--text-500)",textTransform:"uppercase",letterSpacing:.7,borderBottom:"1px solid var(--bg-700)"}}>{h}</th>)}</tr></thead><tbody>{allMetas.flatMap(m=>[...m.indicadores.filter(i=>!deletedIndIds.includes(i.id)),...(customInds[m.id]||[])].map(ind=>{const va=data[ind.id]?.va!==undefined?data[ind.id].va:ind.va;const p=calcProg(ind.vi,va,ind.vm);const st=getStatus(p);return<tr key={ind.id} style={{borderTop:"1px solid rgba(148,163,184,.04)",transition:"background .15s",cursor:"pointer"}} onClick={()=>setSelectedMeta(allMetas.find(x=>x.id===m.id))} onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,.02)"} onMouseOut={e=>e.currentTarget.style.background="transparent"}><td style={{padding:"8px 12px",fontWeight:700,color:"var(--emerald)",fontSize:10,whiteSpace:"nowrap"}}>{m.numero.replace("Meta ","M")}</td><td style={{padding:"8px 12px",color:"var(--text-200)",fontWeight:500,maxWidth:240}}>{ind.desc}</td><td style={{padding:"8px 12px",color:"var(--text-400)",fontFamily:"'JetBrains Mono'",fontSize:10}}>{ind.vi} {ind.un}</td><td style={{padding:"8px 12px",color:"var(--emerald-l)",fontWeight:700,fontFamily:"'JetBrains Mono'",fontSize:10}}>{va} {ind.un}</td><td style={{padding:"8px 12px",color:"var(--amber-l)",fontWeight:600,fontFamily:"'JetBrains Mono'",fontSize:10}}>{ind.vm} {ind.un}</td><td style={{padding:"8px 12px",color:"var(--violet)",fontWeight:600,fontFamily:"'JetBrains Mono'",fontSize:10}}>{ind.vmNovo!==undefined?ind.vmNovo:ind.vm} {ind.un}</td><td style={{padding:"8px 12px"}}><div className="progress-bar" style={{width:60,height:4,display:"inline-block",verticalAlign:"middle",marginRight:6}}><div className="progress-fill" style={{width:`${p}%`,background:statusColor[st]}}/></div><span style={{fontSize:10,fontWeight:700,fontFamily:"'JetBrains Mono'",color:statusColor[st]}}>{p.toFixed(0)}%</span></td><td style={{padding:"8px 12px"}}><span className={`status-badge status-${st}`} style={{fontSize:9}}>{statusLabel[st]}</span></td></tr>}))}</tbody></table></div></div></div>);

  const renderRelatorios=()=>(<div className="fade-in" style={{maxWidth:1000,margin:"0 auto"}}><div style={{marginBottom:20}}><h2 style={{fontSize:22,fontWeight:800,color:"var(--text-50)"}}>Relatórios</h2><p style={{color:"var(--text-500)",fontSize:13}}>Gere relatórios para impressão ou PDF</p></div><div className="card" style={{marginBottom:16}}><div className="card-header"><span className="card-title">📄 Relatório Geral Completo</span></div><div className="card-body"><p style={{fontSize:12,color:"var(--text-400)",marginBottom:14,lineHeight:1.6}}>Relatório com todas as {allMetas.length} metas, {allInds.length} indicadores, diagnóstico PME 2015-2024 e referências ao novo PNE 2026-2036.</p><button className="btn report" onClick={()=>generateReport(allMetas,data,loggedUser.name,customInds,deletedIndIds)}>📄 Gerar Relatório Geral</button></div></div><div className="card"><div className="card-header"><span className="card-title">📊 Relatórios por Eixo</span></div><div className="card-body"><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{EIXOS.slice(1).map(eixo=>{const ms=allMetas.filter(m=>m.eixo===eixo);if(ms.length===0)return null;const avg=metaStats.filter(m=>m.eixo===eixo).reduce((s,m)=>s+m.avgProg,0)/Math.max(ms.length,1);return<div key={eixo} style={{background:"rgba(0,0,0,.15)",borderRadius:12,padding:16,border:"1px solid var(--bg-700)",cursor:"pointer",transition:"all .2s"}} onClick={()=>generateReport(ms,data,loggedUser.name,customInds,deletedIndIds)} onMouseOver={e=>e.currentTarget.style.borderColor="rgba(16,185,129,.25)"} onMouseOut={e=>e.currentTarget.style.borderColor="var(--bg-700)"}><div style={{fontWeight:700,color:"var(--text-100)",fontSize:13,marginBottom:4}}>{eixo}</div><div style={{fontSize:10,color:"var(--text-500)",marginBottom:10}}>{ms.length} metas</div><div className="progress-bar" style={{height:5,marginBottom:8}}><div className="progress-fill" style={{width:`${avg}%`,background:avg>=80?"#16a34a":avg>=50?"#d97706":"#dc2626"}}/></div><span style={{fontSize:10,color:"var(--blue)",fontWeight:600}}>📄 Gerar →</span></div>})}</div></div></div></div>);

  const renderConfig=()=>(<div className="fade-in" style={{maxWidth:800,margin:"0 auto"}}><div style={{marginBottom:20}}><h2 style={{fontSize:22,fontWeight:800,color:"var(--text-50)"}}>Configurações</h2></div><div className="grid-2" style={{marginBottom:18}}><div className="card"><div className="card-header"><span className="card-title">👤 Perfil</span></div><div className="card-body" style={{display:"flex",flexDirection:"column",gap:12}}>{[["Nome",loggedUser.name],["E-mail",loggedUser.email],["Perfil",roleLabel[loggedUser.role]||loggedUser.role]].map(([l,v])=>(<div key={l}><label style={{fontSize:10,fontWeight:700,color:"var(--text-500)",textTransform:"uppercase",display:"block",marginBottom:4}}>{l}</label><div style={{background:"rgba(0,0,0,.2)",border:"1px solid var(--bg-700)",borderRadius:8,padding:"10px 12px",fontSize:12,color:"var(--text-300)"}}>{v}</div></div>))}</div></div><div className="card"><div className="card-header"><span className="card-title">ℹ️ Sobre o Sistema</span></div><div className="card-body"><div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}><div style={{width:52,height:52,background:"linear-gradient(135deg,var(--emerald),var(--teal))",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,boxShadow:"0 4px 12px rgba(16,185,129,.2)"}}>🎓</div><div><div style={{fontSize:16,fontWeight:800,color:"var(--text-100)"}}>PME Pereiro Monitor</div><div style={{fontSize:12,color:"var(--text-500)"}}>Versão 10.0 · IDEB 2023 · PNE 2026-2036 aprovado</div></div></div><p style={{fontSize:12,color:"var(--text-400)",lineHeight:1.7,marginBottom:12}}>Sistema de Monitoramento e Avaliação do Plano Municipal de Educação de Pereiro/CE. Avaliação do PME 2015–2024 (Lei nº 708/2015) e diagnóstico para elaboração do novo PME 2026–2036, em conformidade com o PNE 2026-2036 (19 Objetivos · 73 Metas · 372 Estratégias), aprovado em 25/03/2026.</p><div style={{background:"rgba(59,130,246,.05)",border:"1px solid rgba(59,130,246,.15)",borderRadius:8,padding:"10px 14px",fontSize:11,color:"var(--text-400)",lineHeight:1.6}}><strong style={{color:"var(--blue)"}}>📘 PNE 2026-2036:</strong> Aprovado 25/03/2026 · 19 Obj. · 73 Metas · 372 Estrat. · Prazo PME: 15 meses · Monitoramento bienal · CAQ obrigatório<br/><strong style={{color:"var(--emerald)"}}>📊 IDEB 2023 Pereiro:</strong> AI 8,3 (1º CE) · AF 5,9 · EM 5,0 · Creche 68% · Pré-escola 92% · Integral 81% escolas<br/><strong style={{color:"var(--violet)"}}>🔐 Segurança:</strong> SHA-256 · Senhas não expostas no código<br/><strong style={{color:"var(--cyan)"}}>☁️ Sincronização:</strong> {FIREBASE_OK?"Firebase Firestore — dados compartilhados em tempo real":"localStorage apenas — configure o Firebase para compartilhar dados"}</div><div style={{marginTop:14,paddingTop:12,borderTop:"1px solid rgba(148,163,184,.06)",fontSize:11,color:"var(--text-600)"}}>© 2025-2026 COMEP — Pereiro/CE · Secretário Municipal: Alcides Leite da Silva Neto · v10.0</div></div></div></div>{isAdmin&&<div className="card"><div className="card-header"><span className="card-title">🔐 Gerenciar Senhas</span></div><div className="card-body">{USERS.map(u=>(<div key={u.user} className="pwd-row"><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"var(--text-100)"}}>{u.name}</div><div style={{fontSize:10,color:"var(--text-500)"}}>{u.user} · {roleLabel[u.role]||u.role}</div></div>{pwdEdit===u.user?(<div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}><input type="password" className="form-input" style={{width:130}} placeholder="Nova senha" value={pwdValues.nova} onChange={e=>setPwdValues(v=>({...v,nova:e.target.value}))}/><input type="password" className="form-input" style={{width:130}} placeholder="Confirmar" value={pwdValues.conf} onChange={e=>setPwdValues(v=>({...v,conf:e.target.value}))}/><button className="btn primary" style={{padding:"6px 12px",fontSize:11}} onClick={()=>changePassword(u.user,pwdValues.nova,pwdValues.conf)}>✔ Salvar</button><button className="btn secondary" style={{padding:"6px 10px",fontSize:11}} onClick={()=>{setPwdEdit(null);setPwdValues({nova:"",conf:""})}}>✕</button></div>):(<button className="btn secondary" style={{padding:"5px 12px",fontSize:11}} onClick={()=>{setPwdEdit(u.user);setPwdValues({nova:"",conf:""})}}>🔑 Alterar</button>)}</div>))}</div></div>}</div>);

  const renderContent=()=>{switch(activeTab){case"dashboard":return renderDashboard();case"metas":return renderMetas();case"indicadores":return renderIndicadores();case"relatorios":return renderRelatorios();case"config":return renderConfig();default:return renderDashboard()}};

  return(<div className="app-wrap"><Toast msg={toastMsg} type={toastType}/>{sidebarOpen&&<div className="sidebar-overlay open" onClick={()=>setSidebarOpen(false)}/>}<aside className={`sidebar ${sidebarOpen?"open":""}`}><div className="sidebar-header"><div className="sidebar-logo">🎓</div><div><div style={{color:"var(--text-100)",fontWeight:700,fontSize:14}}>PME Pereiro</div><div style={{color:"var(--text-600)",fontSize:10,marginTop:1}}>Monitoramento</div></div><button type="button" onClick={()=>setSidebarOpen(false)} className="sidebar-close">✕</button></div><nav className="sidebar-nav">{MENU.map(item=>(<button key={item.id} type="button" onClick={()=>{setActiveTab(item.id);setSidebarOpen(false)}} className={`sidebar-item ${activeTab===item.id?"active":""}`}><span className="icon">{item.icon}</span><span>{item.label}</span>{activeTab===item.id&&<span className="arrow">›</span>}</button>))}</nav><div className="sidebar-user"><div className="sidebar-avatar">{(loggedUser.name||"?").charAt(0)}</div><div className="sidebar-user-info"><div className="name">{(loggedUser.name||"").split("—")[0].trim()}</div><div className="role">{roleLabel[loggedUser.role]||loggedUser.role}</div></div><button type="button" onClick={doLogout} style={{background:"none",border:"none",color:"var(--text-500)",cursor:"pointer",fontSize:16,transition:"color .2s"}} title="Sair" onMouseOver={e=>e.currentTarget.style.color="#ef4444"} onMouseOut={e=>e.currentTarget.style.color="var(--text-500)"}>🚪</button></div></aside><div className="main-area"><header className="top-header"><div className="title"><button type="button" className="menu-toggle" onClick={()=>setSidebarOpen(true)}>☰</button><span style={{display:"flex",alignItems:"center",gap:6}}>{(MENU.find(m=>m.id===activeTab)||MENU[0]).icon} {(MENU.find(m=>m.id===activeTab)||MENU[0]).label}</span></div><div style={{display:"flex",alignItems:"center",gap:14}}><div className={`autosave-indicator ${autoSaveState}`}>{autoSaveState==="saving"&&<>⟳ Salvando...</>}{autoSaveState==="saved"&&<>✓ Salvo</>}</div><div style={{fontSize:9,display:"flex",alignItems:"center",gap:4,color:syncStatus==="synced"?"var(--emerald)":syncStatus==="saving"?"var(--amber)":"var(--text-600)"}}><span style={{width:6,height:6,borderRadius:"50%",background:syncStatus==="synced"?"var(--emerald)":syncStatus==="saving"?"var(--amber)":"var(--text-600)",display:"inline-block"}}/>{syncStatus==="synced"?"Online":syncStatus==="saving"?"Sincronizando...":syncStatus==="connecting"?"Conectando...":"Local"}</div><span className="date">{today}</span>{!isRO&&<button type="button" onClick={save} className="btn primary" style={{padding:"6px 16px",fontSize:11,minWidth:90,transition:"all .2s"}}>{saveBtnOk?<span className="save-ok">✔ Salvo!</span>:<>💾 Salvar</>}</button>}</div></header><div className="content-area" ref={mainRef}>{renderContent()}</div></div>{selectedMeta&&<MetaModal meta={selectedMeta} data={data} onUpdate={updateInd} onClose={()=>setSelectedMeta(null)} readOnly={isRO} onAddIndicatorClick={()=>setAddIndMeta(selectedMeta)} customInds={customInds} onRemoveInd={removeIndicator} deletedIndIds={deletedIndIds}/>}{addIndMeta&&<NewIndicatorModal meta={addIndMeta} onSave={addIndicator} onClose={()=>setAddIndMeta(null)}/>}{showNewMeta&&<NewMetaModal onSave={addMeta} onClose={()=>setShowNewMeta(false)} totalMetas={allMetas.length}/>}{confirmDelMeta&&<ConfirmModal msg={`Excluir "${confirmDelMeta.titulo}"?`} onConfirm={()=>deleteMeta(confirmDelMeta.id)} onCancel={()=>setConfirmDelMeta(null)}/>}</div>)}

ReactDOM.createRoot(document.getElementById("app")).render(<MainApp/>);
</script>
</body>
</html>
