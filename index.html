<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>PME Pereiro Monitor — COMEP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-950:#020617;--bg-900:#0f172a;--bg-800:#1e293b;--bg-700:#334155;
  --bg-600:#475569;--text-50:#f8fafc;--text-100:#f1f5f9;--text-200:#e2e8f0;
  --text-300:#cbd5e1;--text-400:#94a3b8;--text-500:#64748b;--text-600:#475569;
  --text-700:#334155;
  --emerald:#10b981;--emerald-d:#059669;--emerald-l:#34d399;
  --amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--teal:#14b8a6;
  --sidebar-w:260px;
}
html{font-size:14px}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg-950);color:var(--text-200);min-height:100vh;overflow:hidden}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.4)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes toastAnim{0%{opacity:0;transform:translateY(12px) scale(.96)}10%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-8px) scale(.96)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(16,185,129,.08)}50%{box-shadow:0 0 40px rgba(16,185,129,.18)}}
@keyframes drift1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.1)}100%{transform:translate(0,0) scale(1)}}
@keyframes drift2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-20px,25px) scale(.95)}100%{transform:translate(0,0) scale(1)}}
@keyframes barGrow{from{width:0}}
.fade-in{animation:fadeIn .3s ease-out both}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#020617,#0f172a 40%,#0f2240 80%);position:relative;overflow:hidden}
.login-orb{position:absolute;border-radius:50%;pointer-events:none}
.login-orb-1{top:12%;left:8%;width:320px;height:320px;background:radial-gradient(circle,rgba(16,185,129,.07),transparent 70%);animation:drift1 16s ease-in-out infinite}
.login-orb-2{bottom:8%;right:12%;width:280px;height:280px;background:radial-gradient(circle,rgba(59,130,246,.05),transparent 70%);animation:drift2 20s ease-in-out infinite}
.login-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(16,185,129,.02) 1px,transparent 1px);background-size:42px 42px}
.login-card{width:420px;max-width:94vw;padding:40px 36px;background:rgba(15,23,42,.88);backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(16,185,129,.12);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03);animation:fadeIn .5s ease-out,glow 5s ease-in-out infinite;position:relative;z-index:1}
.login-logo{width:64px;height:64px;border-radius:16px;margin:0 auto 18px;background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(20,184,166,.1));border:1px solid rgba(16,185,129,.2);display:flex;align-items:center;justify-content:center;font-size:30px}
.login-input{width:100%;padding:12px 14px 12px 42px;font-size:14px;font-weight:500;background:rgba(255,255,255,.04);border:1.5px solid rgba(16,185,129,.12);border-radius:10px;color:var(–text-100);outline:none;transition:all .2s}
.login-input:focus{border-color:var(–emerald);box-shadow:0 0 0 3px rgba(16,185,129,.1);background:rgba(255,255,255,.06)}
.login-input::placeholder{color:var(–text-600)}
.login-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(–text-600);font-size:15px;pointer-events:none}
.login-btn{width:100%;padding:13px;font-size:14px;font-weight:700;background:linear-gradient(135deg,var(–emerald),var(–emerald-d));color:white;border:none;border-radius:10px;cursor:pointer;box-shadow:0 4px 16px rgba(16,185,129,.25);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.login-btn:hover:not(:disabled){background:linear-gradient(135deg,var(–emerald-l),var(–emerald));transform:translateY(-1px);box-shadow:0 6px 24px rgba(16,185,129,.3)}
.login-btn:disabled{background:var(–bg-700);color:var(–text-500);cursor:not-allowed;box-shadow:none}
.login-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:8px 12px;font-size:12px;color:#fca5a5;font-weight:500;animation:shake .4s ease-out;display:flex;align-items:center;gap:6px}

.app-wrap{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(–sidebar-w);background:var(–bg-900);border-right:1px solid rgba(148,163,184,.06);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;animation:slideIn .2s ease-out}
.sidebar-header{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid rgba(148,163,184,.06)}
.sidebar-logo{width:40px;height:40px;background:linear-gradient(135deg,var(–emerald),var(–teal));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sidebar-nav{padding:14px 12px;flex:1}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:2px;color:var(–text-600);text-transform:uppercase;padding:0 8px;margin-bottom:8px}
.sidebar-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(–text-500);cursor:pointer;font-size:13px;font-weight:500;text-align:left;transition:all .15s;margin-bottom:2px}
.sidebar-item:hover{background:rgba(255,255,255,.03);color:var(–text-300)}
.sidebar-item.active{background:rgba(16,185,129,.08);color:var(–emerald-l);border-color:rgba(16,185,129,.2)}
.sidebar-item .icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.sidebar-item .arrow{margin-left:auto;font-size:11px;opacity:.5}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(148,163,184,.06);display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:36px;height:36px;border-radius:50%;background:var(–bg-800);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(–text-400);flex-shrink:0}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-info .name{font-size:12px;font-weight:600;color:var(–text-200);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-info .role{font-size:10px;color:var(–emerald);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sidebar-close{display:none;background:none;border:none;color:var(–text-500);cursor:pointer;font-size:18px;margin-left:auto;padding:4px}

.main-area{flex:1;display:flex;flex-direction:column;min-width:0}
.top-header{height:56px;background:rgba(15,23,42,.8);backdrop-filter:blur(12px);border-bottom:1px solid rgba(148,163,184,.06);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.top-header .title{font-size:15px;font-weight:700;color:var(–text-100);display:flex;align-items:center;gap:8px}
.top-header .date{font-size:12px;color:var(–text-500)}
.content-area{flex:1;overflow-y:auto;padding:20px}
.menu-toggle{background:none;border:none;color:var(–text-400);cursor:pointer;font-size:18px;display:none;padding:4px}

@media(max-width:768px){
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(–sidebar-w);z-index:100;transform:translateX(-100%);transition:transform .3s}
.sidebar.open{transform:translateX(0)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.sidebar-overlay.open{display:block}
.menu-toggle{display:flex}
.sidebar-close{display:block}
.config-grid{grid-template-columns:1fr !important}
.sources-grid{grid-template-columns:1fr !important}
.stats-grid{grid-template-columns:repeat(2,1fr) !important}
}

.card{background:rgba(30,41,59,.5);border:1px solid var(–bg-700);border-radius:12px;backdrop-filter:blur(8px);transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.15)}
.card-header{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:15px;font-weight:700;color:var(–text-100)}
.card-body{padding:6px 18px 18px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{border-radius:12px;padding:16px;border:1px solid;display:flex;align-items:center;justify-content:space-between}
.stat-card .val{font-size:26px;font-weight:900;font-family:‘JetBrains Mono’,monospace}
.stat-card .lbl{font-size:11px;font-weight:500;color:var(–text-400);margin-top:2px}
.stat-card .ico{font-size:24px}

.metric-card{border-radius:10px;padding:14px 16px;margin-bottom:10px;border:1.5px solid;transition:all .2s;position:relative;background:rgba(30,41,59,.4)}
.metric-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.15)}
.metric-tag{font-size:9px;font-weight:700;border-radius:4px;padding:2px 7px;display:inline-block}
.metric-label{font-size:13px;font-weight:700;color:var(–text-100);line-height:1.5}
.metric-hint-btn{background:none;border:none;font-size:10px;color:var(–blue);font-weight:500;cursor:pointer;padding:3px 0;display:flex;align-items:center;gap:3px}
.metric-hint{margin-top:5px;font-size:10px;color:var(–text-500);font-style:italic;line-height:1.5;padding:5px 10px;background:rgba(0,0,0,.2);border-radius:6px;border-left:3px solid var(–bg-700);animation:fadeIn .15s ease-out}
.metric-input{width:100%;border:1.5px solid var(–bg-700);border-radius:7px;padding:7px 10px;font-size:12px;color:var(–text-100);background:rgba(0,0,0,.2);outline:none;transition:all .15s}
.metric-input:focus{border-color:var(–emerald);background:rgba(0,0,0,.3);box-shadow:0 0 0 3px rgba(16,185,129,.08)}
.metric-input:disabled{opacity:.5;cursor:not-allowed}
.metric-select{width:100%;border:1.5px solid var(–bg-700);border-radius:7px;padding:7px 10px;font-size:12px;color:var(–text-100);background:var(–bg-800);cursor:pointer;outline:none}
.metric-select:disabled{opacity:.5;cursor:not-allowed}
.metric-select option{background:var(–bg-800);color:var(–text-200)}

.status-badge{border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.progress-bar{height:8px;border-radius:99px;overflow:hidden;display:flex}
.progress-bar.sm{height:4px}
.progress-seg{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}

.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999}
.toast{padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:toastAnim 2.5s ease-in-out forwards;display:flex;align-items:center;gap:8px;color:white}
.toast.success{background:var(–emerald-d)}
.toast.error{background:var(–red)}

.nav-btn{border:none;border-radius:9px;padding:9px 18px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.nav-btn.primary{background:linear-gradient(135deg,var(–emerald),var(–emerald-d));color:white}
.nav-btn.secondary{background:var(–bg-800);border:1.5px solid var(–bg-700);color:var(–text-300)}
.nav-btn.save{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1c1917}

.data-table{width:100%;border-collapse:collapse;font-size:11px}
.data-table thead th{padding:8px 12px;text-align:left;font-size:9px;font-weight:700;color:var(–text-500);text-transform:uppercase;letter-spacing:.7px;background:rgba(0,0,0,.15)}
.data-table tbody tr{border-top:1px solid rgba(148,163,184,.06);transition:background .15s}
.data-table tbody tr:hover{background:rgba(16,185,129,.03)}
.data-table tbody td{padding:8px 12px}

.filter-select{font-size:11px;border:1.5px solid var(–bg-700);border-radius:8px;padding:6px 10px;color:var(–text-300);background:var(–bg-800);cursor:pointer;font-weight:500}
.alert-critical{background:linear-gradient(135deg,rgba(249,115,22,.08),rgba(234,179,8,.05));border:1.5px solid rgba(249,115,22,.3);border-radius:12px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.alert-readonly{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:10px 16px;font-size:11px;color:var(–blue);font-weight:500;display:flex;align-items:center;gap:8px}
.sources-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:10px}
.source-item{background:rgba(0,0,0,.2);border-radius:6px;padding:6px 10px;border:1px solid var(–bg-700)}
.source-item .stitle{font-weight:700;color:var(–text-200);margin-bottom:2px}
.source-item .url{color:var(–text-500);word-break:break-all;line-height:1.4}
.section-intro{margin-top:10px;background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.12);border-radius:8px;padding:8px 12px;font-size:11px;color:var(–emerald-l);line-height:1.6}
.loading-screen{min-height:100vh;background:var(–bg-950);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:36px;height:36px;border:3px solid rgba(16,185,129,.15);border-top-color:var(–emerald);border-radius:50%;animation:spin .8s linear infinite}
.eixo-chip{padding:6px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .15s;background:rgba(255,255,255,.02);color:var(–text-500)}
.eixo-chip:hover{background:rgba(255,255,255,.04);color:var(–text-300)}
.eixo-chip.active{background:rgba(16,185,129,.08);color:var(–emerald-l);border-color:rgba(16,185,129,.3);font-weight:700}
</style>

</head>

function LoginScreen({onLogin}){
const[user,setUser]=useState(””);const[pass,setPass]=useState(””);
const[error,setError]=useState(””);const[show,setShow]=useState(false);
const[attempts,setAttempts]=useState(0);const[lockUntil,setLockUntil]=useState(0);
const[loading,setLoading]=useState(false);const[now,setNow]=useState(Date.now());
const ref=useRef(null);
useEffect(()=>{ref.current?.focus()},[]);
// FIX: real-time lockout countdown via 1s interval updating `now`
useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t)},[]);
const locked=now<lockUntil;
const lockSec=locked?Math.ceil((lockUntil-now)/1000):0;
// Reset attempts when lock expires
useEffect(()=>{if(!locked&&attempts>=MAX_ATTEMPTS){setAttempts(0);setError(””)}},[locked,attempts]);

const submit=()=>{
if(locked||loading)return;
const u=user.trim().toLowerCase();const p=pass.trim();
if(!u||!p){setError(“Preencha usuário e senha.”);return}
setLoading(true);
setTimeout(()=>{
const f=USERS.find(x=>x.user===u&&x.hash===hashPass(p));
if(f){setError(””);try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({user:f.user,ts:Date.now()}))}catch{}onLogin(f)}
else{const n=attempts+1;setAttempts(n);if(n>=MAX_ATTEMPTS){setLockUntil(Date.now()+LOCKOUT_MS);setError(“Bloqueado por 5 minutos.”)}else setError(`Credenciais inválidas. ${n}/${MAX_ATTEMPTS}`)}
setLoading(false);
},600);
};
return(

// FIX: load data with validation

try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=safeJSON(raw,null);const validated=parsed?validateLoaded(parsed):null;if(validated)setData(prev=>({…prev,…validated}))}}catch{}
setLoaded(true)},[loggedUser]);

// FIX: toast dedup — clear previous timer
const showToast=useCallback((msg,type=“success”)=>{if(toastTimer.current)clearTimeout(toastTimer.current);setToastMsg(msg);setToastType(type);toastTimer.current=setTimeout(()=>{setToastMsg(””);setToastType(””)},2600)},[]);

const save=useCallback(()=>{if(saveRef.current)return;saveRef.current=true;setSaving(true);
try{const s=JSON.stringify(data);if(s.length>4500000){showToast(“Dados muito grandes”,“error”);return}localStorage.setItem(STORAGE_KEY,s);showToast(“Dados salvos com sucesso”)}catch{showToast(“Erro ao salvar”,“error”)}
finally{setSaving(false);saveRef.current=false}},[data,showToast]);

// FIX: auto-save every 30s if data changed
const dataRef=useRef(data);dataRef.current=data;
const lastSavedRef=useRef(JSON.stringify(data));
useEffect(()=>{if(!loggedUser||loggedUser.role===“viewer”)return;
const t=setInterval(()=>{const cur=JSON.stringify(dataRef.current);if(cur!==lastSavedRef.current){try{localStorage.setItem(STORAGE_KEY,cur);lastSavedRef.current=cur}catch{}}},30000);
return()=>clearInterval(t)},[loggedUser]);

const isRO=loggedUser?.role===“viewer”;
const update=useCallback((id,f,v)=>{if(isRO||!ALL_IDS.has(id))return;if(f===“status”&&!VALID_S.has(v))return;const cl=f===“status”?v:sanitize(v);setData(p=>({…p,[id]:{…p[id],[f]:cl}}))},[isRO]);
const toggleHint=useCallback(id=>{setHints(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n})},[]);

const allMetrics=useMemo(()=>SECTIONS.flatMap(s=>s.metrics),[]);
const total=allMetrics.length;
const counts=useMemo(()=>{const c={alcancado:0,parcial:0,“nao-alcancado”:0,“nao-se-aplica”:0,””:0};allMetrics.forEach(m=>{const st=data[m.id]?.status||””;c[st]!==undefined?c[st]++:c[””]++});return c},[data,allMetrics]);
const evaluated=total-counts[””];const pct=total>0?Math.round(evaluated/total*100):0;
const curSection=useMemo(()=>SECTIONS.find(s=>s.id===activeSection)||SECTIONS[0],[activeSection]);
const filtered=useMemo(()=>filterStatus?curSection.metrics.filter(m=>(data[m.id]?.status||””)===filterStatus):curSection.metrics,[curSection,filterStatus,data]);
const sIdx=SECTIONS.findIndex(s=>s.id===activeSection);
const prev=SECTIONS[sIdx-1]||null,next=SECTIONS[sIdx+1]||null;
const secCounts=useCallback(sec=>{const c={alcancado:0,parcial:0,“nao-alcancado”:0,pending:0};sec.metrics.forEach(m=>{const st=data[m.id]?.status||””;if(st===“alcancado”)c.alcancado++;else if(st===“parcial”)c.parcial++;else if(st===“nao-alcancado”)c[“nao-alcancado”]++;else c.pending++});return c},[data]);
// FIX: reset filter when changing section
const changeSection=useCallback(id=>{setActiveSection(id);setFilterStatus(””)},[]);
useEffect(()=>{if(mainRef.current)mainRef.current.scrollTop=0},[activeSection,activeTab]);

if(!loggedUser)return<LoginScreen onLogin={u=>{try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({user:u.user,ts:Date.now()}))}catch{}setLoggedUser(u)}}/>;
if(!loaded)return<div className="loading-screen"><div className="spinner"/><div style={{color:“var(–text-500)”,fontSize:12}}>Carregando…</div></div>;

const today=new Date().toLocaleDateString(“pt-BR”,{weekday:“long”,year:“numeric”,month:“long”,day:“numeric”});
const doLogout=()=>{try{sessionStorage.removeItem(SESSION_KEY)}catch{}setLoggedUser(null);setLoaded(false);setData(buildDefault())};

const renderDashboard=()=>(
<div className=“fade-in” style={{maxWidth:1000,margin:“0 auto”}}>

<div className="stats-grid">
{[{l:“Total”,v:total,c:”#60a5fa”,bg:“rgba(59,130,246,.08)”,bd:“rgba(59,130,246,.2)”,i:“🎯”},{l:“Alcançados”,v:counts.alcancado,c:”#34d399”,bg:“rgba(16,185,129,.08)”,bd:“rgba(16,185,129,.2)”,i:“✅”},{l:“Parciais”,v:counts.parcial,c:”#fbbf24”,bg:“rgba(234,179,8,.08)”,bd:“rgba(234,179,8,.2)”,i:“🟡”},{l:“Não alcançados”,v:counts[“nao-alcancado”],c:”#f87171”,bg:“rgba(239,68,68,.08)”,bd:“rgba(239,68,68,.2)”,i:“🔴”},{l:“Pendentes”,v:counts[””],c:”#94a3b8”,bg:“rgba(148,163,184,.06)”,bd:“rgba(148,163,184,.15)”,i:“⬜”},{l:“Progresso”,v:pct+”%”,c:”#2dd4bf”,bg:“rgba(20,184,166,.08)”,bd:“rgba(20,184,166,.2)”,i:“📈”}].map((c,i)=>(
<div key={i} className="stat-card" style={{background:c.bg,borderColor:c.bd}}><div><div className="val" style={{color:c.c}}>{c.v}</div><div className="lbl">{c.l}</div></div><div className="ico">{c.i}</div></div>
))}
</div>
<div className="card" style={{marginBottom:16}}>
<div className="card-header"><span className="card-title">Progresso por Eixo</span></div>
<div className="card-body">
{SECTIONS.map((s,si)=>{const sc=secCounts(s);const done=sc.alcancado+sc.parcial+sc[“nao-alcancado”];
return(<div key={s.id} style={{display:“flex”,alignItems:“center”,gap:12,padding:“8px 0”,borderBottom:si<SECTIONS.length-1?“1px solid rgba(148,163,184,.06)”:“none”}}>

<div className=“progress-bar sm” style={{background:“rgba(255,255,255,.05)”}}>
{sc.alcancado>0&&<div className=“progress-seg” style={{width:`${sc.alcancado/s.metrics.length*100}%`,background:”#16a34a”}}/>}
{sc.parcial>0&&<div className=“progress-seg” style={{width:`${sc.parcial/s.metrics.length*100}%`,background:”#d97706”}}/>}
{sc[“nao-alcancado”]>0&&<div className=“progress-seg” style={{width:`${sc["nao-alcancado"]/s.metrics.length*100}%`,background:”#dc2626”}}/>}
</div>
</div>
</div>)})}
</div>
</div>
<div className="card">
<div className="card-header"><span className="card-title">Progresso Geral</span><span style={{fontSize:12,color:“var(–text-500)”,fontFamily:”‘JetBrains Mono’”}}>{evaluated}/{total} ({pct}%)</span></div>
<div className="card-body">
<div className=“progress-bar” style={{background:“rgba(255,255,255,.05)”,height:12,borderRadius:99,marginBottom:10}}>
{[[“alcancado”,”#16a34a”],[“parcial”,”#d97706”],[“nao-alcancado”,”#dc2626”],[“nao-se-aplica”,”#6b7280”]].map(([k,c])=>(
<div key={k} className=“progress-seg” style={{width:`${(counts[k]||0)/total*100}%`,background:c}}/>

</div>
<div style={{display:“flex”,gap:16,flexWrap:“wrap”}}>
{[[“alcancado”,”#16a34a”],[“parcial”,”#d97706”],[“nao-alcancado”,”#dc2626”],[“nao-se-aplica”,”#6b7280”]].map(([k,c])=>(
<div key={k} style={{display:“flex”,alignItems:“center”,gap:5,fontSize:11,color:“var(–text-500)”}}><span style={{width:10,height:10,borderRadius:99,background:c,display:“inline-block”}}/>{gc(k).l}: {counts[k]||0}</div>

</div>
</div>
</div>
</div>
);

))}
</nav>
<div className="sidebar-user">
<div className="sidebar-avatar">{(loggedUser.name||”?”).charAt(0)}</div>
<div className="sidebar-user-info">
<div className="name">{(loggedUser.name||””).split(”—”)[0].trim()}</div>
<div className="role">{roleLabel[loggedUser.role]||loggedUser.role}</div>
</div>
<button type=“button” onClick={doLogout} style={{background:“none”,border:“none”,color:“var(–text-500)”,cursor:“pointer”,fontSize:16}} title=“Sair”>🚪</button>
</div>
</aside>
<div className="main-area">
<header className="top-header">
<div className="title">
<button type=“button” className=“menu-toggle” onClick={()=>setSidebarOpen(true)}>☰</button>
{(MENU.find(m=>m.id===activeTab)||MENU[0]).icon} {(MENU.find(m=>m.id===activeTab)||MENU[0]).label}
</div>
<div style={{display:“flex”,alignItems:“center”,gap:12}}>
<span className=“date” style={{display:“none”}}>{today}</span>
<span className="date" style={{}}>{today}</span>
{!isRO&&activeTab===“form”&&<button type=“button” onClick={save} disabled={saving} className=“nav-btn save” style={{padding:“6px 14px”,fontSize:11}}>{saving?“Salvando…”:“💾 Salvar”}</button>}
</div>
</header>
<div className="content-area" ref={mainRef}>{renderContent()}</div>
</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById(“app”)).render(<MainApp/>);
</script>

</body>
</html>
